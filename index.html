<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Styles de base */
        body {
            font-family: 'Assistant', sans-serif;
            color: #333;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            background-color: transparent;
        }

        header img {
            height: 200px; /* Taille doublée */
        }

        .intro-section {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 40px;
        }

        .intro-text {
            width: 100%;
            font-size: 2em; /* Taille agrandie */
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            color: #6fb98f;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-section {
            margin-bottom: 20px;
            display: none; /* Les sections sont cachées par défaut */
        }

        .form-section.active {
            display: block; /* Une section active est visible */
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #6fb98f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #5aa783;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .delta.positive {
            color: green;
        }

        .delta.negative {
            color: red;
        }
    </style>
    <title>Comparatif de Réseaux de Mandataires</title>
</head>
<body>

    <header>
        <img src="logomci2.png" alt="Logo Meilleur Conseil Immo">
    </header>

    <div class="content-wrapper">
        <div class="intro-section">
            <div class="intro-text">
                Vous êtes mandataire immobilier et souhaitez maximiser vos revenus tout en simplifiant votre activité ?
                Ne cherchez plus, Meilleur Conseil Immo est la solution qu’il vous faut !
            </div>
        </div>

        <h2>Comparatif de Réseaux de Mandataires</h2>

        <!-- Section 1 -->
        <div id="section1" class="form-section active">
            <label for="honoraires-actuels">Honoraires annuels HT (€) :</label>
            <input type="number" id="honoraires-actuels" placeholder="Ex : 50000">
            <button onclick="validateSection(1)">Valider</button>
        </div>

        <!-- Section 2 -->
        <div id="section2" class="form-section">
            <label for="pack-mensuel">Forfait mensuel d'adhésion HT :</label>
            <input type="number" id="pack-mensuel" placeholder="Ex : 200">
            <button onclick="validateSection(2)">Valider</button>
        </div>

        <!-- Section 3 -->
        <div id="section3" class="form-section">
            <label for="commission">Votre pourcentage actuel :</label>
            <input type="number" id="commission" placeholder="Ex : 75">
            <button onclick="validateSection(3)">Valider</button>
        </div>

        <!-- Résultats -->
        <div id="results" class="form-section">
            <div id="result-actuel" class="result"></div>
            <div id="result-mci" class="result"></div>
        </div>
    </div>

    <script>
        function validateSection(section) {
            // Validation de chaque section
            const value = document.querySelector(`#section${section} input`).value;

            // Vérifier si la valeur est bien remplie
            if (!value || isNaN(value)) {
                alert("Veuillez remplir correctement ce champ.");
                return;
            }

            // Afficher la section suivante
            const currentSection = document.getElementById(`section${section}`);
            const nextSection = document.getElementById(`section${section + 1}`);
            currentSection.classList.remove("active");

            if (nextSection) {
                nextSection.classList.add("active");
            } else {
                // Tous les champs sont remplis, afficher les résultats
                calculateResults();
            }
        }

        function formatNumber(num) {
            return num.toLocaleString('fr-FR', { style: 'decimal', minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function calculateResults() {
            const honorairesActuels = parseFloat(document.getElementById("honoraires-actuels").value) || 0;
            const forfaitMensuel = parseFloat(document.getElementById("pack-mensuel").value) || 0;
            const commission = parseFloat(document.getElementById("commission").value) || 0;

            // Calcul de l'affiliation actuelle
            const resultActuel = ((honorairesActuels / 1.2) * (commission / 100)) - (forfaitMensuel * 12);
            document.getElementById("result-actuel").innerHTML = formatNumber(resultActuel) + " € /an<br>Avec votre affiliation actuelle";

            // Calcul pour Meilleur Conseil Immo
            let honorairesHT = honorairesActuels / 1.2;
            let resultMCI = 0;

            if (honorairesHT <= 35000) {
                resultMCI = honorairesHT * 0.75;
            } else if (honorairesHT <= 75000) {
                resultMCI = (35000 * 0.75) + ((honorairesHT - 35000) * 0.85);
            } else {
                resultMCI = (35000 * 0.75) + (40000 * 0.85) + ((honorairesHT - 75000) * 1.0);
            }

            const delta = resultMCI - resultActuel;
            const resultMCIText = formatNumber(resultMCI) + " € /an <span class='delta " + (delta > 0 ? "positive" : "negative") + "'>(" + (delta > 0 ? "+" : "") + formatNumber(delta) + " €)</span><br>Avec Meilleur Conseil Immo";
            document.getElementById("result-mci").innerHTML = resultMCIText;

            // Afficher la section des résultats
            document.getElementById("results").classList.add("active");
        }
    </script>
</body>
</html>
